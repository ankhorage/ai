name: Capture canonical formatting
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run format
      - run: bunx ankhorage-eslint . --fix --max-warnings=0 || true
      - run: bun run format
      - name: Export formatted changed files
        run: |
          node -e '
          const fs=require("node:fs"),cp=require("node:child_process");
          const files=cp.execFileSync("git",["diff","--name-only"],{encoding:"utf8"}).split(String.fromCharCode(10)).filter(Boolean);
          for(const path of files){console.log("ANKH_FORMATTED "+JSON.stringify({path,content:fs.readFileSync(path,"utf8")}));}
          if(fs.existsSync("bun.lock")) console.log("ANKH_FORMATTED "+JSON.stringify({path:"bun.lock",content:fs.readFileSync("bun.lock","utf8")}));
          console.log("ANKH_FORMATTED_COUNT "+files.length);
          '
