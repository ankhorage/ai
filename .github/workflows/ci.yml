name: Validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run build
      - run: bun run check-types
      - run: bun run lint
      - run: bun run knip:check
      - run: bun test
      - run: bun run format:check
